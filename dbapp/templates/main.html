{% extends "index.html" %}

{% block title %}Главная{% endblock %}

{% block content %}
<div class="main-page">
    {% for post in posts %}
    <div class="post">
        <h1>{{ post.header }} • {{ post.author.username }}</h1>
        <p>{{ post.desc }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
